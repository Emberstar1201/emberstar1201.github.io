name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # ============ Vue SPA on GitHub Pages 必做两件事 ============
      # 1. 把 index.html 复制一份为 404.html —— GitHub Pages 遇到 404 时返回它，
      #    Vue Router 接管路径，解决"刷新子路由 404"的千年老问题
      # 2. 放一个 .nojekyll —— 阻止 GitHub Pages 用 Jekyll 处理，防止下划线开头
      #    的文件/目录被忽略
      - name: Fix SPA 404 fallback & disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          ls -la dist/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./dist
